name: Gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out all branches and tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        id: install
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/rerg-gitleaks"
          mkdir -p "$tool_dir/ignore"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          # Use built-in rules, not configuration or ignore files from the checkout.
          printf '[extend]\nuseDefault = true\n' > "$tool_dir/config.toml"

      - name: Scan all reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rerg-gitleaks/gitleaks" git \
            --log-opts='--all --full-history -m' \
            --config "$RUNNER_TEMP/rerg-gitleaks/config.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/rerg-gitleaks/ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color .

      - name: Scan the current tree even if history has findings
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rerg-gitleaks/gitleaks" dir \
            --config "$RUNNER_TEMP/rerg-gitleaks/config.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/rerg-gitleaks/ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color .
